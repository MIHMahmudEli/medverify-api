services:
  - type: web
    name: medverify-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://medverify-zeta.vercel.app
      - key: QR_VERIFICATION_BASE_URL
        value: https://medverify-zeta.vercel.app/verify
      - key: TYPEORM_SYNCHRONIZE
        value: "false"
